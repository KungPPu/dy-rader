# 예정 이슈 레이더 — 공개 저장소 실행기(무료 무제한). 코드·기록은 비공개 저장소(KungPPu/tistory-blog).
# 공개 로그에는 키워드를 남기지 않는다. Cloudflare Worker Cron 이 하루 8번 부른다.
name: upcoming

on:
  workflow_dispatch:
    inputs:
      test:
        description: "시험 알림"
        type: boolean
        default: false
      game:
        description: "게임랩 글감 레이더를 지금 시험 알림으로(시각 상관없이)"
        type: boolean
        default: false

concurrency:
  group: upcoming
  cancel-in-progress: false

permissions: {}

jobs:
  upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KungPPu/tistory-blog
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install -g -s @anthropic-ai/claude-code > /dev/null 2>&1

      - name: Run upcoming (출력은 공개 로그에 남기지 않음)
        working-directory: src/issue_finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_APIHUB_ID: ${{ secrets.NAVER_APIHUB_ID }}
          NAVER_APIHUB_SECRET: ${{ secrets.NAVER_APIHUB_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_USAGE_FILE: ${{ github.workspace }}/src/issue_finder/radar_data/naver_api_usage_upcoming.json
          NAVER_SEARCH_DAILY_CAP: "1200"
          NAVER_SEARCH_MONTHLY_CAP: "36000"
          UPCOMING_MODEL: sonnet
        run: |
          if python upcoming.py ${{ inputs.test && '--test' || '' }} > "$RUNNER_TEMP/up.log" 2>&1; then
            echo "upcoming ok"
          else
            echo "upcoming failed — 자세한 내용은 비공개 저장소 radar_data/last_error_upcoming.txt"
            tail -c 4000 "$RUNNER_TEMP/up.log" > radar_data/last_error_upcoming.txt
          fi

      - name: Run game radar (게임랩 글감 — KST 9·17시에만 실제 실행, 출력은 공개 로그에 남기지 않음)
        working-directory: src/issue_finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_APIHUB_ID: ${{ secrets.NAVER_APIHUB_ID }}
          NAVER_APIHUB_SECRET: ${{ secrets.NAVER_APIHUB_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_USAGE_FILE: ${{ github.workspace }}/src/issue_finder/radar_data/naver_api_usage_game.json
          NAVER_SEARCH_DAILY_CAP: "600"
          NAVER_SEARCH_MONTHLY_CAP: "18000"
          GAME_MODEL: sonnet
          GAME_RADAR_HOURS: "9,17"
        run: |
          if python game_radar.py ${{ inputs.game && '--test' || '' }} > "$RUNNER_TEMP/game.log" 2>&1; then
            echo "game radar ok"
          else
            echo "game radar failed — 비공개 저장소 radar_data/last_error_game.txt"
            tail -c 4000 "$RUNNER_TEMP/game.log" > radar_data/last_error_game.txt
          fi
          tail -c 4000 "$RUNNER_TEMP/game.log" > radar_data/last_run_game.txt

      - name: Save state to private repo
        working-directory: src
        run: |
          git config user.name "issue-radar"
          git config user.email "noreply@github.com"
          git add issue_finder/radar_data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "upcoming: state $(date -u +%Y-%m-%dT%H:%MZ)" -q
          for n in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep 7; done
          exit 1
