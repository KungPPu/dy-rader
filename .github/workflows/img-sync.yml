# 초안 사진 → 공개 img/ 복사만(2026-11-28). 레이더(radar.yml)가 안 도는 KST 02~07시에 만든 초안도 사진이 바로 열리게.
# 낮에는 radar.yml 이 10분마다 같은 일을 한다. 출력엔 사진 수만(파일 이름·키워드 없음).
name: img-sync

on:
  schedule:
    - cron: "*/15 17-21 * * *"   # UTC 17~21시 = KST 02~06시
  workflow_dispatch:

concurrency:
  group: img-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KungPPu/tistory-blog
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src
          sparse-checkout: |
            public-radar
            drafts/img
            game-blog/web_img
      - name: Sync
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash src/public-radar/sync_img.sh
